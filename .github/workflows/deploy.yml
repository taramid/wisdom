name: Build and Push Docker Image

on:
    push:
        branches:
            - '**'
    workflow_dispatch: # Дозволяє тиснути кнопку "Run workflow" в UI GitHub

# Скасовує попередню збірку, якщо в цю ж гілку прийшов новий пуш
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Автоматично даємо права для завантаження в GHCR без створення ручних токенів
permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            # Налаштовуємо розширений білдер Docker (Buildx)
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # Авторизація в GitHub Container Registry за допомогою вбудованого токена
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }} # Токен створюється автоматично сам

            # Динамічна генерація тегів та автоматичне приведення назви до нижнього регістру
            # master => :latest
            # * => :*
            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest,enable=${{ github.ref_name == 'master' }}
                      type=ref,event=branch,enable=${{ github.ref_name != 'master' }}
                      type=sha,format=short

            # Збірка та завантаження образу в GHCR
            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # Ключова фіча: кешування шарів Docker через GitHub Actions (збірка за кілька секунд)
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
